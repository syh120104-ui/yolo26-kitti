data:
  root: /content/kitti_yolo
  train: train
  val: val
  names:
  - Car
  - Pedestrian
  - Cyclist
  depth: false
model:
  scale: n
  in_channels: 1
  reg_max: 1
  end2end: true
  o2o_detach: true
  max_det: 300
  botnet: false
  botnet_heads: 4
  p2: true
train:
  imgsz:
  - 256
  - 832
  epochs: 150
  batch: 16
  workers: 2
  optimizer: MuSGD
  lr0: 0.01
  lrf: 0.01
  momentum: 0.94
  weight_decay: 0.0005
  muon_w: 0.5
  sgd_w: 0.5
  warmup_epochs: 3
  close_mosaic: 10
  amp: true
  val_interval: 1
  seed: 0
  patience: 50
loss:
  box: 7.5
  cls: 0.5
  l1: 6.0
  nwd_ratio: 0.5
  progloss: true
  o2m_init: 0.8
  o2m_final: 0.1
assign:
  topk_o2m: 10
  topk_o2o: 7
  topk2_o2o: 1
  alpha: 0.5
  beta: 6.0
  stal: true
  stal_smin: 8
  stal_sref: 16
  nwd_ratio: 0.5
  nwd_C: 42.8
augment:
  mosaic: 1.0
  degrees: 0.0
  translate: 0.1
  scale: 0.5
  fliplr: 0.5
  hsv_h: 0.015
  hsv_s: 0.7
  hsv_v: 0.4
